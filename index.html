<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FaceCam AI</title>
<style>
body{margin:0;background:#080a0f;color:#fff;font-family:system-ui;padding:12px}.wrap{max-width:1000px;margin:auto}.top{display:flex;justify-content:space-between;margin-bottom:12px}.logo{font-weight:900;letter-spacing:.12em}.badge{font-size:11px;border:1px solid #29313d;border-radius:20px;padding:6px}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:14px}.card{background:#10141b;border:1px solid #222b36;border-radius:18px;padding:12px}.stage{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:3/4}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}video{transform:scaleX(-1)}canvas{display:none}.live{position:absolute;top:10px;left:10px;background:#d9ff5a;color:#111700;padding:6px 9px;border-radius:20px;font-size:11px;font-weight:900}.status{position:absolute;bottom:10px;left:10px;right:10px;background:#000b;padding:9px;border-radius:10px;font-size:12px}.buttons{display:flex;gap:7px;margin-top:10px}.btn{flex:1;border:0;border-radius:10px;padding:12px 6px;font-weight:800;background:#1c232d;color:#fff}.main{background:#d9ff5a;color:#101600}label{display:block;color:#a4afbc;font-size:12px;margin:13px 0 6px}input{max-width:100%}#preview{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#07090d}.state,.note{font-size:12px;line-height:1.5;color:#9aa5b2}.state{color:#d9ff5a}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="top"><div class="logo">FACECAM AI</div><div class="badge">GITHUB PAGES</div></div>
<div class="grid"><section class="card"><div class="stage">
<video id="camera" autoplay playsinline muted></video><canvas id="result"></canvas><div class="live">● LIVE</div><div id="status" class="status">Upload a face photo, then start the camera.</div>
</div><div class="buttons"><button id="start" class="btn main">Start Camera</button><button id="switch" class="btn">Switch</button><button id="capture" class="btn">Capture</button></div><div id="modelState" class="state">Tracker not started</div></section>
<aside class="card"><label>Face photo</label><input id="face" type="file" accept="image/*"><img id="preview"><label>Overlay strength</label><input id="strength" type="range" min="0" max="100" value="88" style="width:100%"><label>Overlay size</label><input id="size" type="range" min="75" max="150" value="110" style="width:100%"><p class="note">Browser face tracking with MediaPipe. The camera remains visible even if the tracker fails.</p></aside></div></div>
<script type="module">
import {FilesetResolver,FaceLandmarker} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs";
const v=document.getElementById("camera"),c=document.getElementById("result"),x=c.getContext("2d"),s=document.getElementById("status"),ms=document.getElementById("modelState");
let stream=null,landmarker=null,photo=null,facing="user",running=false,last=0,box=null;
const msg=t=>s.textContent=t;
async function tracker(){ms.textContent="Tracker loading…";const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm");landmarker=await FaceLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:"GPU"},runningMode:"VIDEO",numFaces:1});ms.textContent="Tracker ready"}
async function start(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:960},height:{ideal:720}},audio:false});v.srcObject=stream;await v.play();msg("Camera is working. Loading face tracker…");try{await tracker()}catch(e){console.error(e);ms.textContent="Tracker failed — camera still works";msg("Camera is working, but face tracking could not load. Check internet.");return}c.width=v.videoWidth||960;c.height=v.videoHeight||720;running=true;requestAnimationFrame(loop)}catch(e){msg("Camera failed. Use HTTPS and allow camera permission.")}}
function draw(){x.clearRect(0,0,c.width,c.height);x.save();x.translate(c.width,0);x.scale(-1,1);x.drawImage(v,0,0,c.width,c.height);x.restore()}
function detect(t){if(!landmarker||t-last<70)return;last=t;try{let r=landmarker.detectForVideo(v,t);if(r.faceLandmarks?.length){let p=r.faceLandmarks[0],xs=p.map(q=>q.x),ys=p.map(q=>q.y),a=Math.min(...xs),b=Math.max(...xs),d=Math.min(...ys),e=Math.max(...ys);box={x:a,y:d,w:b-a,h:e-d}}else box=null}catch(e){console.error(e)}}
function overlay(){if(!photo||!box)return;let W=c.width,H=c.height,cx=W*(1-(box.x+box.w/2)),cy=H*(box.y+box.h/2),k=+document.getElementById("size").value/100,w=box.w*W*1.18*k,h=box.h*H*1.22*k,a=+document.getElementById("strength").value/100;x.save();x.globalAlpha=a;x.beginPath();x.ellipse(cx,cy,w*.49,h*.49,0,0,Math.PI*2);x.clip();let ar=photo.width/photo.height,dw=w,dh=w/ar;if(dh<h){dh=h;dw=h*ar}x.drawImage(photo,cx-dw/2,cy-dh/2,dw,dh);x.restore()}
function loop(t){if(!running)return;draw();detect(t);if(photo&&box){overlay();s.textContent="Face detected — following your movement."}else if(photo)s.textContent="Face not detected — look at the camera.";requestAnimationFrame(loop)}
document.getElementById("face").onchange=e=>{let f=e.target.files[0];if(!f)return;let im=new Image();im.onload=()=>{photo=im;document.getElementById("preview").src=im.src;msg("Face photo loaded. Look at the camera.")};im.src=URL.createObjectURL(f)};
document.getElementById("start").onclick=start;document.getElementById("switch").onclick=()=>{facing=facing==="user"?"environment":"user";start()};document.getElementById("capture").onclick=()=>{if(!c.width)return;let a=document.createElement("a");a.download="facecam.png";a.href=c.toDataURL();a.click()};
</script></body></html>
